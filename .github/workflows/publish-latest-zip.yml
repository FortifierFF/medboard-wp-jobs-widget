# Build a WordPress-ready zip and publish GitHub Releases.
# - Tag v{version} from the plugin header (used by Plugin Update Checker / WP admin updates)
# - Also refresh the floating "latest" release for the Medboard download button
name: Publish latest plugin zip

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: ver
        run: |
          VERSION=$(grep -E '^ \* Version:' medboard-jobs-widget.php | head -1 | sed -E 's/.*Version:[[:space:]]*//')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Plugin version: ${VERSION}"

      - name: Build installable zip
        run: |
          # WP expects the zip root folder to match the plugin slug.
          STAGE=medboard-jobs-widget
          rm -rf build
          mkdir -p "build/${STAGE}"
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '*.zip' \
            ./ "build/${STAGE}/"
          cd build
          zip -r medboard-jobs-widget.zip "${STAGE}"
          ls -la medboard-jobs-widget.zip

      - name: Publish versioned release (WP auto-updates)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            Medboard Jobs Widget **${{ steps.ver.outputs.version }}**

            WordPress sites with this plugin installed can update from **Plugins → Updates**.

            Manual install: download `medboard-jobs-widget.zip` → Plugins → Add New → Upload.
          files: build/medboard-jobs-widget.zip
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh floating latest download alias
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          body: |
            Always points at the newest installable zip (currently ${{ steps.ver.outputs.tag }}).

            Stable URL:
            https://github.com/FortifierFF/medboard-wp-jobs-widget/releases/latest/download/medboard-jobs-widget.zip
          files: build/medboard-jobs-widget.zip
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
